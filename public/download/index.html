<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OHKNEE - Reward Arsenal</title>
  <meta name="description" content="Kinetic Reward Arsenal featuring sign-up bonus links, casino codes, instant cash offers, and secret sauce strategies." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Scenic Ambient Backdrop (Stationary Multi-Tier Mist) -->
  <div class="ambient" aria-hidden="true">
    <div class="mist-sky-layer"></div>
    <div class="mist-teal-layer"></div>
    <div class="mist-golden-layer"></div>
    <div class="mist-sunset-layer"></div>
    <span class="blob blob-azure"></span>
    <span class="blob blob-emerald"></span>
    <span class="blob blob-violet"></span>
  </div>

  <div class="ohk-app-wrapper" id="app-wrapper">
    <!-- Header -->
    <header class="site-header" id="site-header">
      <div class="header-inner">
        <div class="brand" id="brand-header">
          <div class="ohk-logo-badge">
            <svg class="ohk-logo-svg" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OHKNEE">
              <defs>
                <linearGradient id="ohkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fffbeb" />
                  <stop offset="25%" stop-color="#fef08a" />
                  <stop offset="60%" stop-color="#f59e0b" />
                  <stop offset="100%" stop-color="#d97706" />
                </linearGradient>
                <linearGradient id="ohkTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="50%" stop-color="#06b6d4" />
                  <stop offset="100%" stop-color="#0d9488" />
                </linearGradient>
                <filter id="ohkGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
                  <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
                </filter>
              </defs>
              <g filter="url(#ohkGlow)">
                <text x="50%" y="78" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="6" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round">OHKNEE</text>
                <text x="50%" y="74" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="6" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">OHKNEE</text>
                <text x="50%" y="74" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="6" text-anchor="middle" fill="url(#ohkGoldGrad)">OHKNEE</text>
              </g>
            </svg>
          </div>
        </div>

        <!-- Symmetrically Visible Navigation Tabs -->
        <nav class="tabs tabs-flat-row" role="tablist" aria-label="Reward categories" id="site-navigation">
          <button id="tab-fast-easy-money" class="tab tab-bright-red is-active" type="button" role="tab" data-tab="fast-easy-money" aria-selected="true">
            <span class="tab-label">100$-150$ 100% Fast Easy</span>
          </button>
          <button id="tab-casino-codes" class="tab tab-top-tier" type="button" role="tab" data-tab="casino-codes" aria-selected="false">
            <span class="tab-label">Casino Codes</span>
          </button>
          <button id="tab-free-money" class="tab tab-top-tier" type="button" role="tab" data-tab="free-money" aria-selected="false">
            <span class="tab-label">Literal Free Money</span>
          </button>
          <button id="tab-referrals" class="tab tab-top-tier" type="button" role="tab" data-tab="referrals" aria-selected="false">
            <span class="tab-label">Referrals / Signup / Bonuses</span>
          </button>
        </nav>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="site-main" id="site-main">
      <!-- Backdrop for Secret Sauce Drawer -->
      <div id="drawer-backdrop" class="ohk-drawer-backdrop"></div>

      <section id="arsenal" class="section">
        <!-- Cards Grid (Populated dynamically by script.js) -->
        <div class="grid" id="cards-grid"></div>
      </section>
    </main>
  </div>

  <!-- Fullscreen Lightbox for Proof Photos -->
  <div id="lightbox-modal" class="lightbox-backdrop">
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close" type="button">&times;</button>
      <img id="lightbox-img" src="" alt="Proof Preview" />
    </div>
  </div>

  <!-- Toast Notification for Copied Promo Codes -->
  <div id="toast" class="toast-popup"></div>

  <!-- Main JavaScript Logic -->
  <script src="script.js"></script>
</body>
</html>
